[project]
name = "devstatus"
version = "1.0.0"
description = "Dynamic developer machine inventory, environment intelligence, diagnostics, and change tracking CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Selman Yalcin"}]
keywords = ["developer-tools", "inventory", "dev-environment", "cli", "ros", "docker", "diagnostics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "psutil>=6.0",
  "textual>=0.80",
]

[project.scripts]
devstatus = "devstatus.cli:app"

[project.urls]
Homepage = "https://github.com/selmanyalcinn/devstatus"
Repository = "https://github.com/selmanyalcinn/devstatus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devstatus"]

[tool.hatch.build]
include = [
  "devstatus/**/*.py",
  "devstatus/rules/*.yaml",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
